[settings]
# Skip gpg signature verification for node; checksum verification still runs.
# Avoids failures where gpg/keyboxd is broken or unavailable (some hosts, containers).
node.gpg_verify = false

[tools]
chezmoi = "latest"
neovim = "latest"
node = "latest"
claude = "latest"
tmux = "latest"
# kiro-cli installed via curl in setup until the mise registry entry is fixed
# (aqua:kiro.dev/kiro-cli currently lacks repo_owner/repo_name and fails to resolve)
# "kiro-cli" = "latest"
